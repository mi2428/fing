name: Dependency advisories

"on":
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check CI contracts
        run: ruby .github/tests/ci_contract.rb
      - name: Check the full lockfile against OSV (RustSec and GHSA)
        # v2.6.0 CLI image; the action wrapper masks the no-lockfile exit status.
        run: >-
          docker run --rm --volume "$PWD:/src:ro"
          ghcr.io/google/osv-scanner@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa
          scan source --lockfile=/src/Cargo.lock
