[package]
name = "fing"
version = "0.9.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
comfy-table = "7.2.2"
crossterm = "0.29.0"
csv = "1.4.0"
dirs = "6.0.0"
dns-lookup = "3.0.1"
hex = "0.4.3"
if-addrs = "0.15.0"
ipnet = "2.12.0"
native-tls = "0.2.14"
pnet = "0.35.0"
quick-xml = "0.39.4"
ratatui = "0.30.0"
reqwest = { version = "0.13.3", features = ["blocking"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
socket2 = { version = "0.6.3", features = ["all"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "net", "time", "sync", "io-util"] }
x509-parser = "0.18.0"
